services:
  observer:
    container_name: observer
    image: quay.io/fxfuren/remnawave-observer:latest
    restart: unless-stopped
    expose:
      - '9000'
    volumes:
      - ./data:/app/data # Данные для записи (unknown_providers.json, backups) - read-write
      - ./config:/app/config:ro # Конфиги Anti-Abuse (agglomerations.yaml, providers.yaml) - read-only
      - ./geodata:/app/geodata # Geodata для n8n updater (caida_as2org, geoip, iptoasn)
    env_file:
      - .env
      - .env.antiabuse # Переменные для GeoIP и Scoring (опционально)
    depends_on:
      vector-aggregator:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - observer-net
      - remnawave-network # Подключение к панели Remnawave (если в одном Docker)
    logging:
      driver: json-file
      options:
        max-size: '8m'
        max-file: '3'

  vector-aggregator:
    image: timberio/vector:0.48.0-alpine
    container_name: vector-aggregator
    restart: unless-stopped
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
    expose:
      - '8686'
    command: ['--config', '/etc/vector/vector.toml']
    networks:
      - observer-net
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:8686/health',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '8m'
        max-file: '3'

  nginx:
    image: nginx:mainline-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - '38213:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      vector-aggregator:
        condition: service_healthy
    networks:
      - observer-net
      - remnawave-network # Подключение к панели Remnawave (если в одном Docker)
    logging:
      driver: json-file
      options:
        max-size: '8m'
        max-file: '3'

  redis:
    image: redis:8.2-m01-alpine3.22
    container_name: redis
    restart: unless-stopped
    expose:
      - '6379'
    volumes:
      - redis-data:/data
    networks:
      - observer-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: '8m'
        max-file: '3'

networks:
  observer-net:
    driver: bridge
  remnawave-network:
    external: true # Если панель Remnawave в отдельном Docker Compose

volumes:
  redis-data:
