services:
  observer:
    container_name: observer
    image: quay.io/fxfuren/remnawave-observer:latest
    restart: unless-stopped
    expose:
      - '9000'
    volumes:
      - ./data:/app/data # Writable data (unknown_providers.json, MMDB files, backups)
      - ./config:/app/config:ro # Anti-Abuse configs (agglomerations.yaml, providers.yaml)
    env_file:
      - .env
    depends_on:
      vector-aggregator:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - observer-net
      - remnawave-network
    logging:
      driver: json-file
      options:
        max-size: '8m'
        max-file: '3'

  vector-aggregator:
    image: timberio/vector:0.48.0-alpine
    container_name: vector-aggregator
    restart: unless-stopped
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
    expose:
      - '8686'
    command: ['--config', '/etc/vector/vector.toml']
    networks:
      - observer-net
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:8686/health',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '8m'
        max-file: '3'

  nginx:
    image: nginx:mainline-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - '38213:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      vector-aggregator:
        condition: service_healthy
    networks:
      - observer-net
      - remnawave-network
    logging:
      driver: json-file
      options:
        max-size: '8m'
        max-file: '3'

  redis:
    image: redis:8.2-m01-alpine3.22
    container_name: redis
    restart: unless-stopped
    expose:
      - '6379'
    volumes:
      - redis-data:/data
    networks:
      - observer-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: '8m'
        max-file: '3'

  postgres:
    image: postgres:17-alpine
    container_name: observer-postgres
    restart: unless-stopped
    expose:
      - '5432'
    environment:
      POSTGRES_DB: observer
      POSTGRES_USER: observer
      POSTGRES_PASSWORD: observer_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - observer-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U observer -d observer']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '8m'
        max-file: '3'

networks:
  observer-net:
    driver: bridge
  remnawave-network:
    external: true

volumes:
  redis-data:
  postgres-data:
