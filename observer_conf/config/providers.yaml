# Типы провайдеров и их модификаторы подозрительности
# Чем выше модификатор - тем подозрительнее
provider_types:
  mobile:
    modifier: 0.3
    description: 'Мобильные пулы (CGNAT, LTE)'
  mobile_isp:
    modifier: 0.5
    description: 'Мобильные операторы'
  fixed:
    modifier: 0.8
    description: 'Проводной ШПД'
  isp:
    modifier: 1.0
    description: 'Крупные ISP'
  regional_isp:
    modifier: 1.0
    description: 'Региональные провайдеры'
  business:
    modifier: 1.2
    description: 'Корпоративные сети'
  infrastructure:
    modifier: 1.3
    description: 'Магистральная инфраструктура'
  hosting:
    modifier: 1.5
    description: 'Хостинг и ДЦ'
  vpn_proxy:
    modifier: 1.8
    description: 'VPN и прокси сервисы'

