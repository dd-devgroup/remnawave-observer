# Provider types and their risk modifiers
# Higher modifier = more suspicious
provider_types:
  mobile:
    modifier: 0.3
    description: 'Mobile pools (CGNAT, LTE)'
  mobile_isp:
    modifier: 0.5
    description: 'Mobile operators'
  fixed:
    modifier: 0.8
    description: 'Fixed broadband'
  isp:
    modifier: 1.0
    description: 'Major ISPs'
  regional_isp:
    modifier: 1.0
    description: 'Regional providers'
  business:
    modifier: 1.2
    description: 'Corporate networks'
  infrastructure:
    modifier: 1.3
    description: 'Backbone infrastructure'
  hosting:
    modifier: 1.5
    description: 'Hosting and data centers'
  vpn_proxy:
    modifier: 1.8
    description: 'VPN and proxy services'

