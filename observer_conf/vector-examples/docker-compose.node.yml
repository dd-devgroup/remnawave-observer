# Docker Compose for Vector Agent on Xray Node
# Deploy this alongside your Xray service

version: '3.8'

services:
  vector:
    image: timberio/vector:0.34.0-alpine
    container_name: vector-agent
    restart: unless-stopped

    volumes:
      # Mount Vector config
      - ./vector-node.toml:/etc/vector/vector.toml:ro

      # Mount Xray logs directory (read-only)
      - /var/log/xray:/var/log/xray:ro
      # Alternative for remnanode:
      # - /var/log/remnanode:/var/log/remnanode:ro

      # Persistent buffer directory (for disk buffering)
      - ./vector-data:/var/lib/vector

    # Run as non-root user (optional, adjust UID/GID as needed)
    # user: "1000:1000"

    # Resource limits to prevent node overload
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    # Health check
    healthcheck:
      test: ["CMD", "vector", "validate", "/etc/vector/vector.toml"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Create data volume for Vector buffer
volumes:
  vector-data:
