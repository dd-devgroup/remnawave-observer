name: Observer CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  WORKDIR: observer

jobs:
  quality:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: observer/go.mod
          cache-dependency-path: observer/go.sum

      - name: Download dependencies
        working-directory: ${{ env.WORKDIR }}
        run: go mod download

      - name: Run go vet
        working-directory: ${{ env.WORKDIR }}
        run: go vet ./...

      - name: Run unit tests
        working-directory: ${{ env.WORKDIR }}
        run: go test -count=1 ./...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: observer/go.mod
          cache-dependency-path: observer/go.sum

      - name: Download dependencies
        working-directory: ${{ env.WORKDIR }}
        run: go mod download

      - name: Run integration tests
        working-directory: ${{ env.WORKDIR }}
        env:
          REDIS_URL: redis://localhost:6379/0
        run: go test -count=1 -tags=integration ./internal/services/storage/...

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality
      - integration
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./observer
          file: ./observer/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - quality
      - integration
      - docker
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get release type from PR labels
        id: release_type
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });

            let releaseType = 'patch';
            const mergedPR = prs.find(pr => pr.merged_at !== null);
            if (mergedPR) {
              const labels = mergedPR.labels.map(l => l.name);
              if (labels.includes('release:major')) releaseType = 'major';
              else if (labels.includes('release:minor')) releaseType = 'minor';
            }
            core.setOutput('type', releaseType);

      - name: Calculate new version
        id: version
        run: |
          set -e
          latest_tag=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi

          version=${latest_tag#v}
          IFS='.' read -r major minor patch <<< "$version"

          case "${{ steps.release_type.outputs.type }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            *)
              patch=$((patch + 1))
              ;;
          esac

          new_version="v${major}.${minor}.${patch}"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Get commits since last release
        id: commits
        run: |
          set -e
          latest_tag="${{ steps.version.outputs.latest_tag }}"

          if [ "$latest_tag" = "v0.0.0" ]; then
            git log --pretty=format:"%s|%an" > /tmp/commits_all.txt
          else
            git log "${latest_tag}..HEAD" --pretty=format:"%s|%an" > /tmp/commits_all.txt
          fi

          commit_count=$(grep -c "." /tmp/commits_all.txt || true)
          echo "commit_count=$commit_count" >> "$GITHUB_OUTPUT"

          grep -v "^Merge " /tmp/commits_all.txt > /tmp/commits.txt || true

      - name: Generate release notes
        if: steps.commits.outputs.commit_count != '0'
        run: |
          set -e
          new_version="${{ steps.version.outputs.new_version }}"
          release_date=$(date +"%Y-%m-%d")

          {
            echo "## Release ${new_version}"
            echo
            echo "**Date:** ${release_date}"
            echo
            echo "### Changes"
            echo
            if [ -s /tmp/commits.txt ]; then
              cut -d'|' -f1 /tmp/commits.txt | sed 's/^/- /'
            else
              echo "No new commits."
            fi
            echo
            echo "### Docker images"
            echo
            echo "\`\`\`bash"
            echo "docker pull ghcr.io/${{ github.repository }}:latest"
            echo "docker pull ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7}"
            echo "\`\`\`"
          } > /tmp/release_notes.md

      - name: Create GitHub Release
        if: steps.commits.outputs.commit_count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
